[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnn-wireless-network-optimizer"
version = "0.1.0"
description = "Graph neural network baseline for conflict-aware wireless scheduling."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Mahmoud Alqudah"}]
dependencies = ["numpy>=2,<3", "torch>=2.4,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
gnn-wireless = "gnn_wireless.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
